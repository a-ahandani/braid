[package]
name = "ramulus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A desktop git client with a lane graph, for local repositories"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image", "http"] }
git2 = { version = "0.21.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
md5 = "0.8.1"
notify = "8.2.1"
rfd = "0.17.2"
