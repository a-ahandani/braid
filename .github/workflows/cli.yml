name: CLI
on:
  push:
    branches: [main]
    paths: ['cli/**', 'web/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', 'web/**']
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm ci
        working-directory: cli
      - run: npm test
        working-directory: cli
